name: Submit DSA solution(s)
description: Paste one or more LeetCode / practice solutions for a single day. Cursor automation formats and commits them all.
title: "dsa: "
labels: ["dsa-submit"]
body:
  - type: markdown
    attributes:
      value: |
        Paste one **or more** solutions below — messy / unformatted code is fine.

        All solutions in this issue go into the **same** `day-N/` folder.

        **Multiple problems:** separate each solution with a line that is only `---`.
        Optionally start each block with a problem name on its own line (`# two-sum` or `problem: two-sum`).

        The automation will:
        1. Put every file in the chosen `day-N/` folder
        2. Name each file from its problem name or main function
        3. Clean formatting to match the repo
        4. Commit + push all of them, then comment on this issue
  - type: dropdown
    id: day_mode
    attributes:
      label: Day folder
      description: Where should all solutions in this issue go?
      options:
        - Latest day folder (default)
        - Create next day folder
        - Specific day (fill in below)
      default: 0
    validations:
      required: true
  - type: input
    id: day_number
    attributes:
      label: Specific day number
      description: Only needed if you chose "Specific day" above (e.g. 19)
      placeholder: "19"
  - type: textarea
    id: solutions
    attributes:
      label: Solution(s)
      description: >
        One or more solutions. Separate problems with a line containing only --- .
        Optional header per block: # problem-name  or  problem: problem-name
      render: python
      placeholder: |
        # two-sum
        def twoSum(self, nums, target):
            seen = {}
            for i, n in enumerate(nums):
                need = target - n
                if need in seen:
                    return [seen[need], i]
                seen[n] = i

        ---

        # contains-duplicate
        def containsDuplicate(self, nums):
            seen = set()
            for n in nums:
                if n in seen:
                    return True
                seen.add(n)
            return False

        ---

        problem: merge-sorted-array
        class Solution(object):
            def merge(self, nums1, m, nums2, n):
                ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Day notes (optional)
      description: Shared notes for the day, or per-problem notes if you label them clearly.
      placeholder: |
        two-sum: hash map O(n)
        contains-duplicate: set O(n)
